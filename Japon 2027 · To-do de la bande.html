<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japon 2027 · To-do de la bande</title>
<style>
:root{--bg:#fbf6f1;--card:#fff;--tx:#1f1a1a;--mut:#7a6f6f;--ac:#d6304a;--ac2:#f4d9de;--bd:#eadfd8;--ok:#2e9b6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171214;--card:#231c1f;--tx:#f5eeee;--mut:#a89a9d;--ac:#ff5d76;--ac2:#3b2229;--bd:#35292d;--ok:#52c995;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171214;--card:#231c1f;--tx:#f5eeee;--mut:#a89a9d;--ac:#ff5d76;--ac2:#3b2229;--bd:#35292d;--ok:#52c995;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.bar{height:12px;background:var(--ac2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ok));border-radius:99px;transition:width .4s}
.big{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:600}
.big span{color:var(--mut);font-weight:400;font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.tab{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 12px;font-size:14px}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tab small{opacity:.75;margin-left:4px}
.add{display:flex;gap:8px;margin:10px 0}
.add input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.add button{border:0;background:var(--ac);color:#fff;border-radius:12px;padding:0 16px;font-size:22px}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--ac);background:none;color:#fff;flex:none;font-size:16px;line-height:1;padding:0}
.done .chk{background:var(--ok);border-color:var(--ok)}
.done .t{text-decoration:line-through;color:var(--mut)}
.t{flex:1;font-size:16px;overflow-wrap:anywhere}
.tag{font-size:12px;color:var(--mut)}
.x{border:0;background:none;color:var(--mut);font-size:18px;padding:4px 8px}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.pp{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:8px 4px;text-align:center;font-size:13px}
.pp.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac2)}
.pp b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp em{font-style:normal;color:var(--mut);font-size:11px}
.pp .bar{height:6px;margin-top:6px}
.who{display:flex;gap:3px;margin-top:4px}
.who u{text-decoration:none;font-size:10px;background:var(--ok);color:#fff;border-radius:99px;padding:1px 6px}
.chk:disabled{opacity:.5}
[hidden]{display:none!important}
.pp.grp{grid-column:1/-1;padding:10px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;justify-content:center}
.pick button,.lnk{border:1px solid var(--ac);background:var(--card);color:var(--ac);border-radius:99px;padding:8px 14px;font-size:14px}
.lnk{border:0;background:none;color:var(--mut);font-size:13px;text-decoration:underline;padding:4px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.names input{padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;min-width:0}
.empty,.note{color:var(--mut);text-align:center;font-size:14px;padding:16px 0}
.note{background:var(--ac2);border-radius:12px;padding:10px;margin-bottom:12px}
</style>
</head>
<body>
<h1>🇯🇵 Japon · la bande</h1>
<p class="sub">Liste partagée, tout se met à jour en direct.</p>
<div id="note" class="note" hidden></div>
<div id="who" class="note" hidden></div>
<div class="people" id="people"></div>
<div id="viewnote" class="note" hidden></div>
<div class="card">
  <div class="big"><div id="gname">Progression globale</div><span id="gtxt">0/0</span></div>
  <div class="bar"><i id="gbar"></i></div>
</div>
<div class="tabs" id="tabs"></div>
<div class="card">
  <div class="big"><div id="ctitle">Tout</div><span id="ctxt"></span></div>
  <div class="bar"><i id="cbar"></i></div>
  <form class="add" id="f" onsubmit="return false">
    <input id="inp" placeholder="Ajouter une idée…" maxlength="120" autocomplete="off">
    <button id="addbtn" type="button" aria-label="Ajouter">+</button>
  </form>
  <div id="list"></div>
</div>
<div style="text-align:center"><button class="lnk" id="ren">✏️ Changer les prénoms</button><button class="lnk" id="chg">🔄 Changer de personne</button></div>
<div id="renbox" class="card" hidden><div>Prénoms</div><div class="names" id="names"></div><button class="pick" style="border:0;background:var(--ac);color:#fff;border-radius:12px;padding:10px 16px" id="save">Enregistrer</button></div>
<script>
const CATS=[["bouffe","🍜","Bouffe"],["lieux","⛩️","Lieux"],["magasins","🛍️","Magasins"],["transport","🚆","Transport"],["autre","📌","Autre"]];
const DEF=["Moi","Sam","Téo","Clément"],IDS=["p1","p2","p3","p4"];
let items=[],cur="all",col=null,metaRef=null,local=false,names=[...DEF],me=null,view=null;
try{me=localStorage.getItem("me")}catch(e){}
if(!IDS.includes(me))me=null;view=me||"p1";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const catOf=k=>CATS.find(c=>c[0]===k)||CATS[4];
const nm=p=>names[IDS.indexOf(p)]||"?";
const isDone=i=>!!i.done;
const mine=p=>items.filter(i=>(i.owner||"all")===p);
function pct(a){const d=a.filter(isDone).length;return [d,a.length,a.length?Math.round(d/a.length*100):0]}
function render(){
  $("who").hidden=!!me;
  if(!me){$("who").innerHTML="Qui es-tu ? <div class='pick'>"+IDS.map(p=>`<button data-me="${p}">${esc(nm(p))}</button>`).join("")+"</div>"}
  const chip=(p,label,cls)=>{const q=pct(mine(p));return `<button class="pp ${cls} ${view===p?"on":""}" data-v="${p}"><b>${label}</b><em>${q[2]} %</em><div class="bar"><i style="width:${q[2]}%"></i></div></button>`};
  $("people").innerHTML=IDS.map(p=>chip(p,esc(nm(p))+(p===me?" (toi)":""),"")).join("")+chip("all","👥 Commun · tout le groupe","grp");
  const grp=view==="all",ro=!grp&&view!==me;
  $("viewnote").hidden=!ro;
  if(ro)$("viewnote").textContent=me?"Tu regardes la liste de "+nm(view)+" (lecture seule).":"Choisis qui tu es pour pouvoir cocher et ajouter.";
  $("f").hidden=ro;
  $("inp").placeholder=grp?"Idée pour tout le groupe…":"Ajouter une idée perso…";
  const base=mine(view);const [gd,gt,gp]=pct(base);
  $("gname").textContent=grp?"Progression du groupe":"Progression de "+nm(view);
  $("gtxt").textContent=gd+"/"+gt+" · "+gp+" %";$("gbar").style.width=gp+"%";
  $("tabs").innerHTML=[["all","✨","Tout"],...CATS].map(c=>{
    const a=c[0]==="all"?base:base.filter(i=>i.cat===c[0]);const q=pct(a);
    return `<button class="tab ${cur===c[0]?"on":""}" data-c="${c[0]}">${c[1]} ${c[2]}<small>${q[0]}/${q[1]}</small></button>`}).join("");
  const sel=base.filter(i=>cur==="all"||i.cat===cur);const [d,t,q]=pct(sel);
  $("ctitle").textContent=cur==="all"?"Tout":catOf(cur)[1]+" "+catOf(cur)[2];
  $("ctxt").textContent=d+"/"+t+" · "+q+" %";$("cbar").style.width=q+"%";
  sel.sort((a,b)=>(isDone(a)-isDone(b))||(a.ts-b.ts));
  $("list").innerHTML=sel.length?sel.map(i=>`<div class="item ${isDone(i)?"done":""}"><button class="chk" ${ro?"disabled":""} data-t="${i.id}">${isDone(i)?"✓":""}</button><div class="t">${esc(i.text)}<div class="tag">${catOf(i.cat)[1]} ${catOf(i.cat)[2]}${grp&&i.by?" · par "+esc(nm(i.by)):""}</div></div>${ro?"":`<button class="x" data-x="${i.id}" aria-label="Supprimer">✕</button>`}</div>`).join(""):'<div class="empty">Rien ici pour l’instant. Ajoute la première idée !</div>';
}
async function add(){
  const v=$("inp").value.trim();if(!v)return;
  if(view!=="all"&&view!==me)return;
  const cat=cur==="all"?"autre":cur;const it={text:v,cat,owner:view,by:me||"",done:false,ts:Date.now()};
  $("inp").value="";
  if(local){items.push({...it,id:"l"+it.ts});render();return}
  try{await col.add(it)}catch(e){note("Impossible d’écrire : demande un accès « contributeur » au propriétaire.")}
}
async function toggle(id){
  if(view!=="all"&&view!==me)return;
  const it=items.find(i=>i.id===id);if(!it)return;
  if(local){it.done=!it.done;render();return}
  try{await col.doc(id).update({done:!it.done})}catch(e){note("Modification refusée : il faut un accès « contributeur ».")}
}
async function del(id){
  if(view!=="all"&&view!==me)return;
  if(local){items=items.filter(i=>i.id!==id);render();return}
  try{await col.doc(id).delete()}catch(e){note("Suppression refusée.")}
}
function setMe(p){me=p;view=p;try{localStorage.setItem("me",p)}catch(e){}render()}
function openRen(){
  $("names").innerHTML=IDS.map((p,i)=>`<input data-n="${i}" value="${esc(names[i])}" maxlength="20">`).join("");
  $("renbox").hidden=false;
}
async function saveNames(){
  const n=[...document.querySelectorAll("[data-n]")].map((e,i)=>e.value.trim()||DEF[i]);
  $("renbox").hidden=true;
  if(local){names=n;render();return}
  try{await metaRef.set({names:n})}catch(e){note("Renommage refusé.")}
}
function note(m){const n=$("note");n.textContent=m;n.hidden=false}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-c],[data-t],[data-x],[data-me],[data-v]");if(!t)return;
  if(t.dataset.c){cur=t.dataset.c;render()}else if(t.dataset.t)toggle(t.dataset.t);else if(t.dataset.me)setMe(t.dataset.me);else if(t.dataset.v){view=t.dataset.v;render()}else del(t.dataset.x);
});
$("ren").addEventListener("click",openRen);$("save").addEventListener("click",saveNames);
$("chg").addEventListener("click",()=>{me=null;try{localStorage.removeItem("me")}catch(e){}render()});
$("addbtn").addEventListener("click",add);
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add()}});
render();
(async()=>{
  let db=null;
  try{db=await Promise.race([claude.use("db"),new Promise(r=>setTimeout(()=>r(null),10000))])}catch(e){}
  if(!db){local=true;note("Mode hors ligne : la liste n’est pas partagée.");return}
  col=db.collection("items");metaRef=db.doc("meta/people");
  metaRef.onSnapshot(d=>{const n=d.exists&&d.data().names;if(Array.isArray(n)&&n.length===4)names=n;render()},()=>{});
  col.onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>note("Connexion perdue, recharge la page."));
})();
</script>
</body>
</html>
